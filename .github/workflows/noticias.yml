name: Noticias del dashboard

on:
  schedule:
    - cron: "30 10 * * *"   # 5:30 a. m. hora Bogotá, todos los días
  workflow_dispatch:         # botón "Run workflow" para probar a mano

permissions:
  contents: write

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar y filtrar noticias
        run: python scripts/noticias.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add noticias.json noticias_vistas.json
          git diff --cached --quiet || git commit -m "Noticias $(date -u +%F)"
          git push
